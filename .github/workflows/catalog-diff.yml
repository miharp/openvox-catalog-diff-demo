---
name: Catalog diff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: catalog-diff-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  catalog-diff:
    name: Compare catalogs with the base branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare catalogs
        env:
          BASE_REF: ${{ github.base_ref }}
        run: catalog-diff/run.sh "origin/${BASE_REF}" HEAD

      - name: Summarize
        if: ${{ !cancelled() }}
        run: |
          catalog-diff/summary.py catalog-diff/.work/report/report.json \
            | tee summary.md >> "$GITHUB_STEP_SUMMARY"

      # Pull requests from forks get a read-only token, so they only get the
      # job summary.
      - name: Comment on the pull request
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file summary.md --edit-last --create-if-none
